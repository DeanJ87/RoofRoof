name: Docs & Demo

# The docs and the demo are CI artifacts: the repository is private, so there
# is no GitHub Pages site and no public demo host (spec 001, research R9).
# Download the "site" artifact from a run and open site/index.html (or serve
# it with `python3 -m http.server -d site`); the demo is under site/demo/.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Rebuild by hand: gh workflow run docs.yml --ref main
  workflow_dispatch:

# Cancel an in-progress build when a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck web UI
        run: npm run typecheck
        working-directory: web

      - name: Init MSW service worker
        run: npx msw init public/ --save
        working-directory: web

      # Relative asset paths: the demo is opened from the downloaded artifact
      # (site/demo/), not from a host root.
      - name: Build demo site
        run: npm run build:demo
        env:
          DEMO_BASE: ./
        working-directory: web

      - name: Take screenshots
        run: npm run screenshots
        working-directory: web

      # Every page and state of the device UI, at desktop and 320 px, against
      # web/tests/a11y/baseline.json (SQMeter spec 022).
      - name: Accessibility checks (device UI)
        run: npx playwright test tests/a11y.spec.ts tests/a11y-announce.spec.ts
        working-directory: web

      # Layout overlap, the dashboard (every tile and state) and the demo
      # (crawl, no outside requests, contracts), against the same demo build.
      - name: Layout, dashboard and demo checks
        run: npx playwright test tests/layout-overlap.spec.ts tests/dashboard.spec.ts tests/demo.spec.ts
        working-directory: web

      # Diagrams (SQMeter spec 024): the site serves its own pinned mermaid, every
      # diagram must parse and render, and no page may use a CDN.
      # Mermaid and the Scalar API reference only (no browser flasher).
      - name: Vendor mermaid and Scalar for the docs
        run: node scripts/vendor-mermaid.mjs && node scripts/vendor-scalar.mjs
        working-directory: web

      - name: Render every diagram
        run: npm run docs:diagrams
        working-directory: web

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Accessibility checks (docs)
        run: npx playwright test -c playwright.docs.config.ts
        working-directory: web

      - name: Site serves its own mermaid
        run: python3 tools/docs/diagrams.py --site site

      # The demo is part of the docs artifact, under site/demo/.
      - name: Add the demo to the site
        run: |
          rm -rf site/demo
          cp -r web/dist-demo site/demo

      - name: Upload site artifact
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: site/
          if-no-files-found: error
          retention-days: 14
