; PlatformIO configuration for RoofRoof (ESP32 DevKit, roll-off roof controller)

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5 (SQMeter spec 027). Needs PlatformIO Core >= 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

; C++17; strict warnings for our own sources only (build_src_flags) - the 3.x
; toolchain is GCC 14 and third-party libraries trip its new deprecations.
build_flags = 
    -std=gnu++17
    ; Arduino core logs errors only in release builds; our Logger is unaffected.
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=1
    ; AsyncTCP defaults to priority 10 on core 1, above the roof's control
    ; task (5): a burst of requests could starve the 20 ms step. 3 keeps it
    ; above the main loop (1) and below the roof (spec 003 research R1).
    -DCONFIG_ASYNC_TCP_PRIORITY=3
    ; A slow WebSocket client (weak WiFi) could otherwise pin 32 queued
    ; multi-KB status messages each.
    -DWS_MAX_QUEUED_MESSAGES=4
    ; AsyncTCP defaults to a 16 KB task stack; measured peak is ~6.8 KB
    ; (inherited from SQMeter, where a GitHub update check ran TLS in the handler; RoofRoof has none), so 11 KB keeps a margin.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=11264

build_unflags = 
    -std=gnu++11
    -std=gnu++2b

build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wno-implicit-fallthrough

; Dependencies
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    ; PubSubClient exactly: RoofIo::Mqtt::deliveryOf reads its receive buffer (spec 008 research R2)
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP-IDF options, applied by rebuilding the framework (pioarduino hybrid
; compile). scripts/check_sdkconfig.py fails the build if any line here didn't
; land in the generated sdkconfig (SQMeter spec 027 FR-010: options get renamed between IDF
; releases). WPA3 stays on (SQMeter spec 027 clarification).
custom_sdkconfig =
    CONFIG_LOG_DEFAULT_LEVEL_ERROR=y
    CONFIG_LOG_MAXIMUM_EQUALS_DEFAULT=y
    CONFIG_ESP_ERR_TO_NAME_LOOKUP=n
    CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=y
    CONFIG_COMPILER_OPTIMIZATION_SIZE=y
    ; No C++ exceptions: nothing here catches one (an allocation failure
    ; aborts either way), and the unwind tables cost about 55 KB per build.
    CONFIG_COMPILER_CXX_EXCEPTIONS=n
    ; A failed IDF assertion still stops the device with a backtrace; only its
    ; file and expression text is left out.
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE=n
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE=n
    CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
    CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
    CONFIG_BT_ENABLED=n
    CONFIG_MBEDTLS_TLS_SERVER=n
    CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT=n
    CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
    CONFIG_MBEDTLS_CAMELLIA_C=n
    CONFIG_MBEDTLS_CCM_C=n
    CONFIG_MBEDTLS_XTEA_C=n
    CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
    ; ESP-IDF's root certificate bundle: RoofRoof pins its own roots
    ; (include/AlertRootCA.h) and never attaches the bundle,
    ; but NetworkClientSecure always links it. The common-CA subset instead of
    ; the full ~69 KB one.
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=n
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN=y
    CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_NONE=n
    ; TLS client features no RoofRoof peer (Pushover, ntfy, webhooks) uses:
    ; rare curves (P-256, P-384 and X25519 stay),
    ; PSK and static-ECDH key exchanges, EC J-PAKE, writing PEM, parsing CSRs
    ; and CRLs, renegotiation.
    CONFIG_MBEDTLS_ECP_DP_SECP192R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP224R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP521R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP192K1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP224K1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_SECP256K1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_BP256R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_BP384R1_ENABLED=n
    CONFIG_MBEDTLS_ECP_DP_BP512R1_ENABLED=n
    ; Plain PSK stays: NetworkClientSecure won't build without one PSK mode.
    CONFIG_MBEDTLS_PSK_MODES=y
    CONFIG_MBEDTLS_KEY_EXCHANGE_PSK=y
    CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_PSK=n
    CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_PSK=n
    CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA=n
    CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA=n
    CONFIG_MBEDTLS_KEY_EXCHANGE_ECJPAKE=n
    CONFIG_MBEDTLS_ECJPAKE_C=n
    CONFIG_MBEDTLS_PEM_WRITE_C=n
    CONFIG_MBEDTLS_X509_CSR_PARSE_C=n
    CONFIG_MBEDTLS_X509_CRL_PARSE_C=n
    CONFIG_MBEDTLS_SSL_RENEGOTIATION=n
    ; TLS buffers allocated while in use, not for the whole connection: the
    ; an alert send's parse buffer and a TLS session must fit side by side.
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
    ; WPA3 for the setup hotspot (it's open); joining WPA3 networks stays on.
    CONFIG_ESP_WIFI_SOFTAP_SAE_SUPPORT=n
    CONFIG_ESP_WIFI_WPS_SOFTAP_REGISTRAR=n
    CONFIG_ESP_WIFI_DPP_SUPPORT=n
    CONFIG_ESP_WIFI_11KV_SUPPORT=n
    CONFIG_ESP_WIFI_11R_SUPPORT=n
    CONFIG_ESP_WIFI_NAN_ENABLE=n
    CONFIG_ESP_WIFI_MESH_SUPPORT=n
    CONFIG_ESP_WIFI_FTM_ENABLE=n
    CONFIG_ESP_WIFI_GMAC_SUPPORT=n
    CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA=n

; Espressif cloud, camera, audio, Zigbee, modem, Ethernet and provisioning
; components the Arduino framework bundles. RoofRoof uses none of them (only mdns
; and littlefs); leaving them out shortens the framework rebuild and lets
; CONFIG_MBEDTLS_CERTIFICATE_BUNDLE be off (ESP Insights embeds a certificate
; that needs it).
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/rmaker_cmd_resp
    espressif/rmaker_common_events
    espressif/rmaker_console
    espressif/rmaker_system_ctrl
    espressif/rmaker_time_sync
    espressif/rmaker_work_queue
    espressif/esp_schedule
    espressif/esp_secure_cert_mgr
    espressif/network_provisioning
    espressif/qrcode
    espressif/esp-zigbee-lib
    espressif/esp-zboss-lib
    espressif/esp-modbus
    espressif/esp_modem
    espressif/esp-dsp
    espressif/fb_gfx
    espressif/lan867x
    espressif/lan86xx_common
    espressif/libsodium
    espressif/esp_daylight
    espressif/json_generator
    espressif/json_parser
    espressif/jsmn
    espressif/cbor
    chmorgan/esp-libhelix-mp3

; Filesystem settings: one whole-chip layout for both builds (SQMeter spec 027).
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 115200
upload_protocol = esptool  ; Default to serial, can override with --upload-port IP

; Build web UI before uploading filesystem; check the framework options landed.
extra_scripts =
    pre:scripts/clean_sdkconfig.py
    pre:scripts/build_web.py
    post:scripts/check_sdkconfig.py

; Native (desktop) unit-test environment for the platform-independent logic
; in lib/ - no ESP32 toolchain, no hardware, fast CI feedback.
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
build_flags =
    -std=gnu++17
    -Ilib/AlertLogic/include
    -Ilib/AlpacaLogic/include
    -Ilib/CloseSequenceLogic/include
    -Ilib/CaptiveDns/include
    -Ilib/ConfigBackup/include
    -Ilib/ConfigModel/include
    -Ilib/ConnectionBudget/include
    -Ilib/DeviceCore/include
    -Ilib/DriverLogic/include
    -Ilib/FirmwareImage/include
    -Ilib/HaDiscovery/include
    -Ilib/NetAddress/include
    -Ilib/NinaLogic/include
    -Ilib/RoofIoLogic/include
    -Ilib/RoofLogic/include
    -Ilib/SafetyInputLogic/include
    -Ilib/SettingsDeps/include
